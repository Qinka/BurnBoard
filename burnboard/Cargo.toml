[package]
name = "burnboard"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "burnboard-server"
path = "src/bin/server.rs"

[dependencies]
# Protobuf
prost = "0.12"
prost-types = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# IO and encoding
bytes = "1.5"
byteorder = "1.5"
crc32fast = "1.4"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Web server
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
prost-build = "0.12"
